name: deployment sekvens
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: Install NodeJS
       uses: actions/setup-node@v3
       with:
        node-version: 18
     - name: Install dependencies
       run: npm ci
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: Install NodeJS
       uses: actions/setup-node@v3
       with:
        node-version: 18
     - name: Install dependencies
       run: npm ci
     - name: test
       run: npm test